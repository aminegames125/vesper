name: Bug report
description: Something does not work the way it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [Kodi guide troubleshooting](https://github.com/aminegames125/vesper/blob/main/docs/KODI.md#troubleshooting) first.
        For a security problem, do not open an issue: use the Security tab.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. In Kodi, open TV > Guide
        2. ...
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Where does it happen?
      options:
        - Kodi add-on
        - Server
        - Admin panel
        - Recording or playback
        - Docker or install
        - Something else
    validations:
      required: true
  - type: input
    id: kodi
    attributes:
      label: Kodi version
      description: Settings > System > System information, for example 21.1 Omega.
      placeholder: "21.1 (Omega)"
  - type: input
    id: system
    attributes:
      label: Device and operating system
      description: Where Kodi runs, and where the server runs if different.
      placeholder: "Kodi on Fire TV Stick 4K Max; server in Docker on Ubuntu 24.04"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Server mode
      options:
        - Lite
        - Full
        - Not sure
    validations:
      required: true
  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: Add-ons > My add-ons > Video add-ons > Vesper > Information.
    validations:
      required: true
  - type: input
    id: server_version
    attributes:
      label: Server version
      description: Shown in the admin panel sidebar, or `vesper-server --version`.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The relevant lines of `kodi.log` (enable debug logging) and of the server output. Remove passwords and provider addresses first.
      render: text
