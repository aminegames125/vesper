name: Release

# Push a tag like v0.2.0 (or run this by hand) to build everything and publish a GitHub release:
#   - the Vesper server for Windows, Linux x64 and Linux arm64
#   - the Kodi add-on zip and the Kodi repository zip (what the Kodi repository installs)
#   - a multi-architecture Docker image of the server (linux/amd64 + linux/arm64) on GitHub Container Registry
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release, for example v0.2.0 (it must already exist)
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always

jobs:
  # Only what changed since the previous release is built (scripts/release-plan.mjs). Parts that did
  # not change are copied from the release that last built them, so every release page still has the
  # server downloads and the Kodi add-on, and the image gets this release's tag without a rebuild.
  plan:
    name: What to build and what to carry forward
    runs-on: ubuntu-latest
    outputs:
      build_server: ${{ steps.plan.outputs.build_server }}
      build_kodi: ${{ steps.plan.outputs.build_kodi }}
      server_source: ${{ steps.plan.outputs.server_source }}
      kodi_source: ${{ steps.plan.outputs.kodi_source }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The scripts come from the tag being released; a tag from before they existed builds everything.
          if [ -f scripts/release-plan.mjs ]; then
            node scripts/release-plan.mjs "$TAG"
          else
            { echo "build_server=true"; echo "build_kodi=true"; echo "server_source=$TAG"; echo "kodi_source=$TAG"; } | tee -a "$GITHUB_OUTPUT"
          fi

  draft:
    name: Create draft release
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Create the draft if it does not exist yet
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ needs.plan.outputs.build_server }}
          KODI: ${{ needs.plan.outputs.build_kodi }}
          SERVER_SOURCE: ${{ needs.plan.outputs.server_source }}
          KODI_SOURCE: ${{ needs.plan.outputs.kodi_source }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
            {
              echo
              if [ "$SERVER" = true ]; then S="rebuilt"; else S="unchanged, the files and image are the ones from $SERVER_SOURCE"; fi
              if [ "$KODI" = true ]; then K="rebuilt"; else K="unchanged, the files are the ones from $KODI_SOURCE"; fi
              echo "**In this release:** server $S. Kodi add-on $K."
            } >> "$RUNNER_TEMP/notes.md"
            gh release create "$TAG" --draft --title "Vesper $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  # Copies what was not rebuilt from the release that built it, so nothing is missing from this one.
  carry:
    name: Carry forward what did not change
    needs: [plan, draft]
    if: ${{ needs.plan.outputs.build_server != 'true' || needs.plan.outputs.build_kodi != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        if: ${{ needs.plan.outputs.build_server != 'true' }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Copy the files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SERVER: ${{ needs.plan.outputs.build_server }}
          BUILD_KODI: ${{ needs.plan.outputs.build_kodi }}
          SERVER_SOURCE: ${{ needs.plan.outputs.server_source }}
          KODI_SOURCE: ${{ needs.plan.outputs.kodi_source }}
        run: |
          mkdir carried
          if [ "$BUILD_SERVER" != true ]; then
            gh release download "$SERVER_SOURCE" --dir carried --pattern 'vesper-server-*'
          fi
          if [ "$BUILD_KODI" != true ]; then
            gh release download "$KODI_SOURCE" --dir carried --pattern 'plugin.video.vesper-*' --pattern 'repository.vesper-*'
          fi
          gh release upload "$TAG" carried/* --clobber
      - name: Give the unchanged server image this release's tag
        if: ${{ needs.plan.outputs.build_server != 'true' }}
        env:
          SERVER_SOURCE: ${{ needs.plan.outputs.server_source }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vesper-server"
          docker buildx imagetools create -t "$IMAGE:$TAG" "$IMAGE:$SERVER_SOURCE"

  server:
    name: Server (${{ matrix.name }})
    needs: [plan, draft]
    if: ${{ needs.plan.outputs.build_server == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, ext: tar.gz }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: tar.gz }
          - { name: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: zip }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the admin panel (embedded into the server)
        run: pnpm --filter @vesper/admin build
      - name: Build the server
        run: cargo build --release -p vesper-server
      - name: Package
        id: pack
        run: |
          NAME="vesper-server-${TAG}-${{ matrix.name }}"
          mkdir "$NAME"
          if [ "${{ matrix.ext }}" = "zip" ]; then BIN=vesper-server.exe; else BIN=vesper-server; fi
          cp "target/release/$BIN" "$NAME/"
          cp LICENSE "$NAME/"
          cp docs/SERVER.md "$NAME/README.md"
          if [ "${{ matrix.ext }}" = "zip" ]; then
            7z a "$NAME.zip" "$NAME" >/dev/null
          else
            tar czf "$NAME.tar.gz" "$NAME"
          fi
          FILE="$NAME.${{ matrix.ext }}"
          if command -v sha256sum >/dev/null; then sha256sum "$FILE" > "$FILE.sha256"; else shasum -a 256 "$FILE" > "$FILE.sha256"; fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "${{ steps.pack.outputs.file }}" "${{ steps.pack.outputs.file }}.sha256" --clobber

  kodi:
    name: Kodi add-on
    needs: [plan, draft]
    if: ${{ needs.plan.outputs.build_kodi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test
        run: python -I -m unittest discover -s apps/kodi/tests
      - name: Pack and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${TAG#v}"
          VERSION="${VERSION%%-*}"
          python -I apps/kodi/build.py --version "$VERSION" --out out
          # The repository add-on (install this one first; it keeps the add-on up to date).
          python apps/kodi/make_repo.py --version "$VERSION" --out repo >/dev/null
          cp repo/repository.vesper/repository.vesper-*.zip out/
          cd out
          for f in *.zip; do sha256sum "$f" > "$f.sha256"; done
          gh release upload "$TAG" *.zip *.sha256 --clobber

  docker:
    name: Server image
    needs: [plan, draft]
    if: ${{ needs.plan.outputs.build_server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/vesper-server" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.TAG }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish release
    needs: [plan, carry, server, kodi, docker]
    # A part that was skipped on purpose is fine; one that failed is not.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "$TAG" --draft=false --latest
