name: Pages

# The landing page (apps/site) is published at https://aminegames125.github.io/vesper/
on:
  push:
    branches: [main]
    paths:
      - "apps/site/**"
      - "docs/screenshots/**"
      - "brand/**"
      - "apps/kodi/**"
      - ".github/workflows/pages.yml"
  # A new release has a new version number, and the Kodi repository must offer it.
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @vesper/site build
      - name: Kodi repository (served at /kodi/)
        run: python apps/kodi/make_repo.py --version "$(node -p "require('./package.json').version")" --out apps/site/dist/kodi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
