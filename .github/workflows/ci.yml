name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  web:
    name: Admin panel and client (pnpm + Turborepo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome check .
      - name: Typecheck, test and build
        run: pnpm turbo run typecheck test build

  kodi:
    name: Kodi add-on
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test (without a server)
        run: python -I -m unittest discover -s apps/kodi/tests -v
      - name: Pack
        run: python -I apps/kodi/build.py --version 0.0.0
      - name: Build the repository
        run: python apps/kodi/make_repo.py --version 0.0.0 --out "$RUNNER_TEMP/kodi"

  rust:
    name: Rust (recorder and server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p vesper-recorder -p vesper-server --all-targets -- -D warnings
      - run: cargo test -p vesper-recorder -p vesper-server

  e2e:
    name: End to end (a real server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build -p vesper-server
      - name: Downloads, deletion timer, guide, share links, guard
        run: node scripts/e2e.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The Kodi add-on against a real server, in lite and full mode
        run: node scripts/e2e-kodi.mjs
