name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Works out which parts the push or pull request touched (scripts/changes.mjs), so only those are
  # built and tested. A part that is skipped shows as skipped, never as failed.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.parts.outputs.server }}
      web: ${{ steps.parts.outputs.web }}
      kodi: ${{ steps.parts.outputs.kodi }}
      site: ${{ steps.parts.outputs.site }}
      tooling: ${{ steps.parts.outputs.tooling }}
      all: ${{ steps.parts.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: parts
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/changes.mjs --base "$BASE" --head HEAD

  web:
    name: Admin panel and client (pnpm + Turborepo)
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' || needs.changes.outputs.site == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm exec biome check .
      - name: Typecheck, test and build
        run: pnpm turbo run typecheck test build

  tooling:
    name: Release scripts
    needs: changes
    if: ${{ needs.changes.outputs.tooling == 'true' || needs.changes.outputs.all == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs

  kodi:
    name: Kodi add-on
    needs: changes
    if: ${{ needs.changes.outputs.kodi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test (without a server)
        run: python -I -m unittest discover -s apps/kodi/tests -v
      - name: Pack
        run: python -I apps/kodi/build.py --version 0.0.0
      - name: Build the repository
        run: python apps/kodi/make_repo.py --version 0.0.0 --out "$RUNNER_TEMP/kodi"

  rust:
    name: Rust (recorder and server)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy -p vesper-recorder -p vesper-server --all-targets -- -D warnings
      - run: cargo test -p vesper-recorder -p vesper-server

  e2e:
    name: End to end (a real server)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' || needs.changes.outputs.kodi == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo build -p vesper-server
      - name: Downloads, deletion timer, guide, share links, guard
        run: node scripts/e2e.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: The Kodi add-on against a real server, in lite and full mode
        run: node scripts/e2e-kodi.mjs
