<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" role="img" aria-label="Vesper design kit: colours, type and the mark">
  <rect width="1280" height="760" fill="#0d0d0f"/>
  <g font-family="'Geist','Segoe UI',system-ui,sans-serif" fill="#F4F1EA">
    <text x="64" y="84" font-family="'Bricolage Grotesque','Segoe UI',system-ui,sans-serif" font-size="44" font-weight="800">Vesper design kit</text>
    <text x="64" y="116" font-size="18" fill="#9a9aa3">One accent. Warm paper, never pure white. Calm surfaces. Motion only where it helps.</text>

    <!-- mark -->
    <text x="64" y="176" font-size="14" fill="#9a9aa3" letter-spacing="2">THE MARK</text>
    <g transform="translate(64 196) scale(3)">
      <rect width="64" height="64" rx="14" fill="#151518"/>
      <rect x="8" y="10" width="48" height="7" rx="3.5" fill="#FF5C7A"/>
      <rect x="14" y="21" width="36" height="7" rx="3.5" fill="#F4F1EA"/>
      <rect x="20" y="32" width="24" height="7" rx="3.5" fill="#F4F1EA"/>
      <rect x="26" y="43" width="12" height="7" rx="3.5" fill="#F4F1EA"/>
    </g>
    <g transform="translate(296 196) scale(3)">
      <rect width="64" height="64" rx="14" fill="#FBF9F8" stroke="#E8E2E0"/>
      <rect x="8" y="10" width="48" height="7" rx="3.5" fill="#D81B60"/>
      <rect x="14" y="21" width="36" height="7" rx="3.5" fill="#1B1B1F"/>
      <rect x="20" y="32" width="24" height="7" rx="3.5" fill="#1B1B1F"/>
      <rect x="26" y="43" width="12" height="7" rx="3.5" fill="#1B1B1F"/>
    </g>
    <text x="64" y="414" font-size="14" fill="#9a9aa3">Four scanlines forming a V. The top line is the accent. Keep clear space of one bar height around it.</text>

    <!-- colour -->
    <text x="64" y="468" font-size="14" fill="#9a9aa3" letter-spacing="2">DARK PALETTE</text>
    <g font-size="13">
      <rect x="64" y="486" width="120" height="96" rx="14" fill="#0D0D0F" stroke="#2a2a30"/><text x="76" y="570">Ink #0D0D0F</text>
      <rect x="196" y="486" width="120" height="96" rx="14" fill="#151518" stroke="#2a2a30"/><text x="208" y="570">Panel #151518</text>
      <rect x="328" y="486" width="120" height="96" rx="14" fill="#1E1E22" stroke="#2a2a30"/><text x="340" y="570">Raised #1E1E22</text>
      <rect x="460" y="486" width="120" height="96" rx="14" fill="#2A2A30"/><text x="472" y="570">Line #2A2A30</text>
      <rect x="592" y="486" width="120" height="96" rx="14" fill="#F4F1EA"/><text x="604" y="570" fill="#1b1b1f">Paper #F4F1EA</text>
      <rect x="724" y="486" width="120" height="96" rx="14" fill="#FF5C7A"/><text x="736" y="570" fill="#1a0a0f">Coral #FF5C7A</text>
    </g>
    <text x="64" y="624" font-size="14" fill="#9a9aa3" letter-spacing="2">LIGHT PALETTE</text>
    <g font-size="13">
      <rect x="64" y="642" width="120" height="80" rx="14" fill="#FBF9F8"/><text x="76" y="710" fill="#1b1b1f">Ink #FBF9F8</text>
      <rect x="196" y="642" width="120" height="80" rx="14" fill="#FFFFFF"/><text x="208" y="710" fill="#1b1b1f">Panel #FFFFFF</text>
      <rect x="328" y="642" width="120" height="80" rx="14" fill="#F3EFEE"/><text x="340" y="710" fill="#1b1b1f">Raised #F3EFEE</text>
      <rect x="460" y="642" width="120" height="80" rx="14" fill="#E8E2E0"/><text x="472" y="710" fill="#1b1b1f">Line #E8E2E0</text>
      <rect x="592" y="642" width="120" height="80" rx="14" fill="#1B1B1F"/><text x="604" y="710">Text #1B1B1F</text>
      <rect x="724" y="642" width="120" height="80" rx="14" fill="#D81B60"/><text x="736" y="710" fill="#fff">Pink #D81B60</text>
    </g>

    <!-- type -->
    <text x="900" y="176" font-size="14" fill="#9a9aa3" letter-spacing="2">TYPE</text>
    <text x="900" y="244" font-family="'Bricolage Grotesque','Segoe UI',system-ui,sans-serif" font-size="64" font-weight="800">Aa</text>
    <text x="900" y="276" font-size="15" fill="#9a9aa3">Bricolage Grotesque · display</text>
    <text x="900" y="344" font-size="64" font-weight="500">Aa</text>
    <text x="900" y="376" font-size="15" fill="#9a9aa3">Geist · interface</text>

    <text x="900" y="440" font-size="14" fill="#9a9aa3" letter-spacing="2">COMPONENTS</text>
    <rect x="900" y="458" width="120" height="40" rx="20" fill="#FF5C7A"/><text x="960" y="484" text-anchor="middle" font-weight="600" fill="#1a0a0f">Primary</text>
    <rect x="1034" y="458" width="120" height="40" rx="20" fill="#1E1E22"/><text x="1094" y="484" text-anchor="middle" font-weight="500">Soft</text>
    <rect x="900" y="514" width="254" height="56" rx="16" fill="#151518" stroke="#2a2a30"/><text x="920" y="548" font-size="15">Card · 16px radius · 1px line</text>

    <text x="900" y="614" font-size="14" fill="#9a9aa3" letter-spacing="2">PRINCIPLES</text>
    <text x="900" y="642" font-size="15">· Short fades only, no parallax</text>
    <text x="900" y="666" font-size="15">· Honour prefers-reduced-motion</text>
    <text x="900" y="690" font-size="15">· Icons move on hover, never loop</text>
    <text x="900" y="714" font-size="15">· Text on accent always passes AA</text>
  </g>
</svg>
