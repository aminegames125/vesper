<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" role="img" aria-label="Vesper: a scheduled IPTV recorder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151518"/>
      <stop offset="1" stop-color="#0b0b0d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#ff5c7a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff5c7a" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="card"><rect width="1280" height="440" rx="28"/></clipPath>
    <style>
      .rec { animation: pulse 1.6s ease-in-out infinite; }
      .grow { transform-origin: left center; transform-box: fill-box; animation: grow 5s ease-in-out infinite alternate; }
      @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
      @keyframes grow { from { transform: scaleX(.55) } to { transform: scaleX(1) } }
      @media (prefers-reduced-motion: reduce) { .rec, .grow { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#glow)"/>

    <!-- timeline grid -->
    <g stroke="#ffffff" stroke-opacity="0.06">
      <path d="M700 70v300M780 70v300M860 70v300M940 70v300M1020 70v300M1100 70v300M1180 70v300"/>
    </g>
    <g font-family="'Segoe UI',system-ui,sans-serif" font-size="14" fill="#6e6e78">
      <text x="700" y="56">20:00</text><text x="860" y="56">22:00</text><text x="1020" y="56">00:00</text><text x="1180" y="56">02:00</text>
    </g>

    <!-- schedule rows -->
    <g font-family="'Segoe UI',system-ui,sans-serif" font-size="17" font-weight="600">
      <rect x="716" y="100" width="200" height="40" rx="12" fill="#1e1e22" stroke="#2a2a30"/>
      <rect class="grow" x="716" y="100" width="200" height="40" rx="12" fill="#ff5c7a"/>
      <circle class="rec" cx="738" cy="120" r="6" fill="#0d0d0f"/>
      <text x="754" y="126" fill="#1a0a0f">Evening news</text>

      <rect x="860" y="156" width="256" height="40" rx="12" fill="#1e1e22" stroke="#2a2a30"/>
      <text x="880" y="182" fill="#f4f1ea">Match of the day</text>

      <rect x="780" y="212" width="170" height="40" rx="12" fill="#1e1e22" stroke="#2a2a30"/>
      <text x="800" y="238" fill="#f4f1ea">Documentary</text>

      <rect x="1020" y="268" width="150" height="40" rx="12" fill="#1e1e22" stroke="#2a2a30"/>
      <text x="1040" y="294" fill="#f4f1ea">Late film</text>

      <rect x="700" y="324" width="190" height="40" rx="12" fill="#1e1e22" stroke="#2a2a30" stroke-dasharray="5 5"/>
      <text x="720" y="350" fill="#9a9aa3">Every weekday</text>
    </g>

    <!-- mark and name -->
    <g transform="translate(72 34) scale(2.6)">
      <rect x="8" y="10" width="48" height="7" rx="3.5" fill="#FF5C7A"/>
      <rect x="14" y="21" width="36" height="7" rx="3.5" fill="#F4F1EA"/>
      <rect x="20" y="32" width="24" height="7" rx="3.5" fill="#F4F1EA"/>
      <rect x="26" y="43" width="12" height="7" rx="3.5" fill="#F4F1EA"/>
    </g>
    <text x="80" y="262" font-family="'Segoe UI',system-ui,sans-serif" font-size="104" font-weight="800" fill="#F4F1EA" letter-spacing="-4">Vesper</text>
    <text x="84" y="312" font-family="'Segoe UI',system-ui,sans-serif" font-size="28" fill="#9a9aa3">Your IPTV, recorded while you are away.</text>
    <text x="84" y="372" font-family="'Segoe UI',system-ui,sans-serif" font-size="19" fill="#6e6e78">Schedules · TV guide · Downloads · Chromecast · Android and Android TV</text>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="439" rx="27.5" fill="none" stroke="#2a2a30"/>
</svg>
