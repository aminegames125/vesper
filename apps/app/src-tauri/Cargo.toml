[package]
name = "vesper"
version.workspace = true
description = "A fast, light IPTV player with a cinema-first interface."
edition.workspace = true
license.workspace = true

[lib]
name = "vesper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde.workspace = true
vesper-recorder = { path = "../../../crates/vesper-recorder" }
