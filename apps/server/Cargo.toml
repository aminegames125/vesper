[package]
name = "vesper-server"
description = "Vesper Cloud: your own IPTV server with cloud recording, sync and an admin panel."
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
vesper-recorder = { path = "../../crates/vesper-recorder" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.7", features = ["cors", "compression-gzip"] }
futures-util = "0.3"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
argon2 = "0.6"
getrandom = "0.4"
sha2 = "0.11"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
clap = { version = "4", features = ["derive", "env"] }
rust-embed = "8"
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
